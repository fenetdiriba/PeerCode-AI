# Render Blueprint for the PeerCode server on the FREE plan ($0). See DEPLOY.md.
# Free plan: 512 MB RAM, 0.1 CPU, no persistent disk, spins down after ~15 min idle.
# Checkpoints are kept in the instance's temp directory: they work while it runs and are
# lost on restart, redeploy or spin-down. "Load demo scenario" rebuilds either challenge.
services:
  - type: web
    name: peercode-server
    runtime: node
    plan: free
    # The server runs from source. Do NOT run `npm run build` here: that is the Vite frontend
    # build (deployed on Vercel) and needs ~2.5 GB of memory.
    buildCommand: npm ci
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # One test process at a time fits 512 MB / 0.1 CPU comfortably (measured peak ~200 MB).
      - key: TEST_CONCURRENCY
        value: "1"
      - key: AI_DAILY_LIMIT
        value: "150"
      # Random demo access code generated by Render; read it in the dashboard and share it with judges.
      - key: DEBUGGER_ACCESS_CODE
        generateValue: true
      # Set these in the dashboard (never in this file):
      - key: MODEL_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
