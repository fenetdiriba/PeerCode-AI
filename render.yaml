# Alternative to Railway: Render Blueprint for the PeerCode server (free plan supports WebSockets).
services:
  - type: web
    name: peercode-server
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    # Free Render disks are ephemeral: checkpoints reset on every deploy (use Railway + a volume to keep them).
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: DEBUGGER_ACCESS_CODE
        sync: false
